<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 皖信投资台账</title>
<style>
:root {
    --primary: #0ea5e9;
    --primary-dark: #0284c7;
    --text: #0f172a;
    --muted: #64748b;
    --line: rgba(148, 163, 184, .24);
    --danger: #dc2626;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background:
        radial-gradient(circle at 18% 12%, rgba(14,165,233,.18), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(250,204,21,.16), transparent 28%),
        linear-gradient(135deg, #f0f9ff 0%, #f8fafc 52%, #fefce8 100%);
    color: var(--text);
}
.login-shell {
    width: min(380px, calc(100vw - 32px));
    background: rgba(255,255,255,.86);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 26px 70px rgba(15, 23, 42, .12);
    backdrop-filter: blur(18px);
    padding: 30px;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
}
.brand-mark {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    box-shadow: 0 14px 28px rgba(14,165,233,.24);
}
.brand-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .02em;
}
.brand-subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
}
.form-label {
    display: block;
    color: #334155;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
}
.password-wrap {
    position: relative;
}
    input {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0 14px;
    outline: none;
    font-size: 15px;
    color: var(--text);
    background: rgba(248,250,252,.82);
    transition: border .2s ease, box-shadow .2s ease, background .2s ease;
}
    input:focus {
    background: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(14,165,233,.12);
}
.error {
    min-height: 22px;
    margin: 10px 0 8px;
    color: var(--danger);
    font-size: 13px;
}
button {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 14px 28px rgba(14,165,233,.22);
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
}
button:hover { transform: translateY(-1px); box-shadow: 0 18px 34px rgba(14,165,233,.28); }
button:disabled { opacity: .62; cursor: not-allowed; transform: none; box-shadow: none; }
.hint {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    margin-top: 16px;
}
</style>
</head>
<body>
<main class="login-shell">
    <div class="brand">
        <div class="brand-mark">皖</div>
        <div>
            <div class="brand-title">皖信投资台账</div>
            <div class="brand-subtitle">固投项目管理系统</div>
        </div>
    </div>
    <form id="loginForm">
        <label class="form-label" for="username">账号</label>
        <input id="username" type="text" autocomplete="username" maxlength="40"
               placeholder="请输入账号" autofocus style="margin-bottom:14px">
        <label class="form-label" for="password">访问密码</label>
        <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" placeholder="请输入访问密码">
        </div>
        <div class="error" id="errorMsg"></div>
        <button id="loginBtn" type="submit">登录</button>
    </form>
    <div class="hint">登录状态 8 小时内有效</div>
</main>
<script>
const form = document.getElementById('loginForm');
const username = document.getElementById('username');
const password = document.getElementById('password');
const errorMsg = document.getElementById('errorMsg');
const loginBtn = document.getElementById('loginBtn');

form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const account = username.value.trim();
    const value = password.value.trim();
    if (!account) {
        errorMsg.textContent = '请输入账号';
        username.focus();
        return;
    }
    if (!value) {
        errorMsg.textContent = '请输入密码';
        password.focus();
        return;
    }
    errorMsg.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = '登录中...';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: account, password: value })
        });
        const data = await res.json();
        if (res.ok && data.success) {
            window.location.href = '/';
            return;
        }
        errorMsg.textContent = data.error || '登录失败';
    } catch (err) {
        errorMsg.textContent = '网络异常，请稍后重试';
    } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
    }
});
</script>
</body>
</html>
